<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="150" height="150">
  <!-- Dice background with animation -->
  <rect x="5" y="5" width="90" height="90" rx="15" fill="white" stroke="#333" stroke-width="2">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="0.5s"
      repeatCount="indefinite"/>
  </rect>
  
  <!-- Animated dots that change position -->
  <g>
    <circle cx="30" cy="30" r="8" fill="#333">
      <animate attributeName="opacity" values="1;0;1;0;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="30" r="8" fill="#333">
      <animate attributeName="opacity" values="0;1;0;1;0" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="50" r="8" fill="#333">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="70" r="8" fill="#333">
      <animate attributeName="opacity" values="0;1;1;0;0" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="70" r="8" fill="#333">
      <animate attributeName="opacity" values="1;0;1;1;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
